name: credit_app
description: A credit management application for tracking customer debt offline-first.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.4
  arabic_reshaper: ^0.0.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0+4
  shared_preferences: ^2.3.4
  share_plus: ^10.1.3
  open_file: ^3.3.2
  # ONLINE FEATURES - Currently disabled for offline-only operation
  # Uncomment these if you want to add online sync features in the future:
  # http: ^1.2.2
  # mongo_dart: ^0.10.6
  # connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  crypto: ^3.0.3
  file_picker: ^8.0.0+1
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  intl_utils: ^2.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  windows:
    generate: true
  image_path: "grocery.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "grocery.png"

flutter:
  uses-material-design: true
  # Stub AssetManifest.json: printing package still loads it; Flutter no longer generates it (breaking change).
  # assets/fonts/: add NotoSans-Regular.ttf and NotoNaskhArabic-Regular.ttf for native/desktop PDF.
  assets:
    - AssetManifest.json
    - assets/fonts/
